name: Build and publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download Android project archive
        run: curl --fail --location --retry 3 -o android-source.zip https://github.com/mustafaalomariofficial-maker/pcremote/releases/download/source-v1/PCRemote-Android-Project.zip
      - name: Extract Android project
        run: unzip -q android-source.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 34 SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p PCRemote-Android assembleDebug
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: PC Remote Android v1.0.${{ github.run_number }}
          body: "Debug APK built by GitHub Actions. Minimum Android version: 7.0 (API 24)."
          files: PCRemote-Android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
